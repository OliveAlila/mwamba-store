name: Build Mwamba Store

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check backend JavaScript syntax
        run: |
          node --check server.js
          for file in server/*.js scripts/*.js; do node --check "$file"; done
      - name: Build frontend
        run: npm run build
